<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Briggstone AI Platform</title>
  <meta name="description" content="Sign in to the Briggstone AI enterprise orchestration platform. Whitelist access required.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://briggstone.in/login.html">
  <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['"Plus Jakarta Sans"','Inter','system-ui','sans-serif']},colors:{brand:{blue:'#2563EB',mint:'#10B981','blue-soft':'#EFF6FF','mint-soft':'#E6F8F1'}}}}}</script>
</head>
<body class="bg-[#F8FAFC] text-slate-800 font-sans antialiased min-h-screen flex flex-col">
  <header class="border-b border-slate-100 bg-white">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center justify-between h-16">
      <a href="index.html" class="flex items-center gap-2"><img src="assets/logo.svg" alt="Briggstone" class="h-8 w-auto"></a>
      <a href="register.html" class="text-xs font-semibold text-brand-blue hover:underline">Request Access</a>
    </nav>
  </header>

  <main class="flex-1 flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl border border-slate-100 shadow-sm p-8 lg:p-10">
        <div class="text-center mb-8">
          <h1 class="text-2xl font-bold text-[#0F172A] mb-2">Sign In</h1>
          <p class="text-sm text-slate-500">Access the Briggstone orchestration console</p>
        </div>

        <div id="whitelist-notice" class="hidden mb-6 p-4 rounded-xl bg-amber-50 border border-amber-200">
          <p class="text-sm text-amber-800 font-medium">Whitelist Required</p>
          <p class="text-xs text-amber-700 mt-1">Platform access is restricted to whitelisted enterprise accounts. Contact us to request access.</p>
        </div>

        <form id="login-form" class="space-y-5">
          <div>
            <label for="email" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Work Email</label>
            <input type="email" id="email" name="email" required placeholder="you@company.com" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-blue focus:border-brand-blue outline-none">
          </div>
          <div>
            <label for="password" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Password</label>
            <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full rounded-xl border border-slate-200 px-4 py-2.5 text-sm focus:ring-2 focus:ring-brand-blue focus:border-brand-blue outline-none">
          </div>
          <button type="submit" id="login-btn" class="w-full px-6 py-3 rounded-full text-sm font-semibold bg-[#0F172A] text-white hover:bg-slate-800 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">Sign In</button>
        </form>

        <p class="text-center text-xs text-slate-400 mt-6">
          Don't have access? <a href="register.html" class="text-brand-blue hover:underline">Request whitelist enrollment</a>
        </p>
      </div>

      <p class="text-center text-[10px] text-slate-400 mt-6 font-mono">WHITELIST_ONLY_ACCESS — SOC2_TYPE_II</p>
    </div>
  </main>

  <script src="js/common.js"></script>
  <script>
    (function () {
      var form = document.getElementById('login-form');
      var btn = document.getElementById('login-btn');
      var notice = document.getElementById('whitelist-notice');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var email = document.getElementById('email').value;
        btn.disabled = true;
        btn.textContent = 'Verifying...';
        notice.classList.add('hidden');

        checkWhitelistAccess(email, function (allowed) {
          btn.disabled = false;
          btn.textContent = 'Sign In';
          if (allowed) {
            showToast('Welcome back! Redirecting to console...', 'success');
            setTimeout(function () {
              window.location.href = 'platform.html';
            }, 1500);
          } else {
            notice.classList.remove('hidden');
            showToast('Access denied — email not on whitelist', 'error');
          }
        });
      });
    })();
  </script>
</body>
</html>
